# `rustcfml --build` discovers native modules at `native/<crate>/Cargo.toml`.
# This is the shape a real consumer uses: a thin crate in the app that depends on
# the published module and re-exports its `register`. Keeping it thin means the
# app pins the module version and nothing else.
[package]
name    = "typst-doc"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# Path-dep for this in-repo example. A real app would use:
#   rustcfml-typst = "0.1"
rustcfml-typst = { path = "../../../.." }
rustcfml-cli   = { path = "../../../../../RustCFML/crates/cli" }
